[package]
name = "spt_x402_escrow"
version = "0.1.0"
description = "On-chain enforcement of SPT-Txn authorization for x402 payments on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spt_x402_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

# Aligned to the spt_anchor toolchain (Anchor 1.1.2 / Solana 3.x / Rust 1.89).
[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
# Solana 3.x split the old monolithic solana_program crate; these are already in
# the resolved tree (pulled transitively), so pinning them adds no new versions.
sha2 = "0.10"
solana-instructions-sysvar = "3.0"

# litesvm integration test harness (matches spt_anchor's known-good setup).
[dev-dependencies]
# "precompiles" loads the native ed25519/secp256k1 precompiles (LiteSVM::new()
# auto-enables them) — required to verify our Ed25519 attestation instruction.
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.0"
solana-instruction = "3.0"
